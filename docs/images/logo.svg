<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>BrewReel</title>
  <defs>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC247"/>
      <stop offset="1" stop-color="#E0710E"/>
    </linearGradient>
    <clipPath id="glassInside">
      <path d="M164 150 L190 406 Q192 424 210 424 L302 424 Q320 424 322 406 L348 150 Z"/>
    </clipPath>
  </defs>

  <!-- viewfinder corners -->
  <g fill="none" stroke="#E8870F" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 150 L58 86 Q58 58 86 58 L150 58"/>
    <path d="M362 58 L426 58 Q454 58 454 86 L454 150"/>
    <path d="M454 362 L454 426 Q454 454 426 454 L362 454"/>
    <path d="M150 454 L86 454 Q58 454 58 426 L58 362"/>
  </g>

  <!-- beer in the glass -->
  <path d="M164 150 L190 406 Q192 424 210 424 L302 424 Q320 424 322 406 L348 150 Z" fill="url(#beer)"/>

  <!-- glass wall (open at the top) -->
  <path d="M164 150 L190 406 Q192 424 210 424 L302 424 Q320 424 322 406 L348 150"
        fill="none" stroke="#3A2312" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- foam outline (drawn behind the foam fill) -->
  <g fill="#3A2312" stroke="#3A2312" stroke-width="28" stroke-linejoin="round">
    <circle cx="194" cy="150" r="34"/>
    <circle cx="244" cy="128" r="42"/>
    <circle cx="298" cy="134" r="38"/>
    <circle cx="336" cy="160" r="28"/>
  </g>
  <path d="M150 196 Q180 212 210 198 Q240 184 268 200 Q298 214 330 198 Q348 190 362 198 L362 140 L150 140 Z"
        clip-path="url(#glassInside)" fill="#3A2312" stroke="#3A2312" stroke-width="20" stroke-linejoin="round"/>

  <!-- foam -->
  <g fill="#FFF3D9">
    <circle cx="194" cy="150" r="34"/>
    <circle cx="244" cy="128" r="42"/>
    <circle cx="298" cy="134" r="38"/>
    <circle cx="336" cy="160" r="28"/>
    <path d="M150 196 Q180 212 210 198 Q240 184 268 200 Q298 214 330 198 Q348 190 362 198 L362 140 L150 140 Z"
          clip-path="url(#glassInside)"/>
  </g>

  <!-- play mark inside the beer -->
  <path d="M234 280 L234 356 L296 318 Z" fill="#FFF3D9" stroke="#FFF3D9" stroke-width="18" stroke-linejoin="round"/>

  <!-- glass highlight -->
  <path d="M186 232 L200 384" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="10" stroke-linecap="round"/>


</svg>
